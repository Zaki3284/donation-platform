# ===== APPLICATION NAME =====
spring.application.name=donation-platform

# ===== DATABASE CONFIGURATION =====
# Change these to match your PostgreSQL setup
spring.datasource.url=jdbc:postgresql://localhost:5432/donation_platform
spring.datasource.username=postgres
spring.datasource.password=moha4408

# ===== JPA/HIBERNATE CONFIGURATION =====
# Creates tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT CONFIGURATION =====
# ?? IMPORTANT: Change these in production!

# Secret key for JWT signing
# Must be at least 256 bits (32 characters)
# ?? In production: Use environment variable!
jwt.secret=mySecretKeyForDonationPlatformThatIsAtLeast256BitsLong123456

# Token expiration in milliseconds
# 86400000 = 24 hours
jwt.expiration=86400000

# ===== LOGGING =====
logging.level.org.springframework.security=DEBUG
logging.level.com.donationplatform=DEBUG

# ===== SERV
#
#
#
# ER PORT =====
server.port=9099



 spring:
        main:
            allow-bean-definition-overriding: true